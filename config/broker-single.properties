# Single-broker config for quick local experiments (no replication).
broker.id=1
listeners.host=localhost
listeners.port=9092
log.dirs=data/broker-1

log.segment.bytes=1048576
log.index.interval.bytes=4096

# One broker in the cluster; replication factor is clamped to 1 automatically.
cluster.brokers=1:localhost:9092
topics=demo:3:1

replica.fetch.interval.ms=100
replica.fetch.max.bytes=1048576
replica.lag.time.max.ms=10000
produce.timeout.ms=30000