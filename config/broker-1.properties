# Broker 1 of a local 3-broker cluster (run all three on one machine).
broker.id=1
listeners.host=localhost
listeners.port=9092
log.dirs=data/broker-1

# Storage tuning
log.segment.bytes=1048576
log.index.interval.bytes=4096

# Cluster membership - MUST be identical on every broker (id:host:port,...)
cluster.brokers=1:localhost:9092,2:localhost:9093,3:localhost:9094

# Topics auto-created on startup - MUST be identical on every broker (name:partitions:replicationFactor)
topics=orders:3:3,events:2:2

# Replication
replica.fetch.interval.ms=100
replica.fetch.max.bytes=1048576
replica.lag.time.max.ms=10000
produce.timeout.ms=30000